name: Deploy to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Pages ignores staticwebapp.config.json; a 404.html copy of the landing
      # page emulates the SWA catch-all so old deep links still land here.
      - name: Copy index.html to 404.html
        run: cp src/index.html src/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: src
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
